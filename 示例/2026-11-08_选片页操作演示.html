const key='photo-cull-v1:'+DATA.project_id;

function save(){try{localStorage.setItem(key,JSON.stringify([...selected]));}catch(e){storageOK=false;}storage();}
function storage(){$('storage').textContent=storageOK?'勾选尝试保存在当前浏览器。请导出JSON备份；换浏览器或电脑不会自动同步。':'此环境无法保存浏览器状态；请在关闭前导出JSON，之后可导入恢复。';}

function draw(){

 for(const p of visible){
  const a=el('article',selected.has(p.id)?'chosen':'');a.dataset.id=p.id;
  if(p.detail){const detail=el('img','detail');detail.src=p.detail;detail.alt='经人工核对的局部预览：'+p.relative;detail.loading='lazy';a.append(detail);}
  const open=el('button','open');open.setAttribute('aria-label','放大 '+p.relative);const im=el('img');im.src=p.preview;im.alt=p.relative;im.loading='lazy';open.append(im);open.onclick=()=>openAt(p.id);a.append(open);
